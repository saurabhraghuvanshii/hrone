# Local development MongoDB only (the app itself is not containerized).
# Values come from .env:  docker compose up -d   /   docker compose down
services:
  mongo:
    image: ${MONGO_IMAGE:-mongo:7}
    container_name: ${MONGO_CONTAINER:-hrone-mongo}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mongo_data:
